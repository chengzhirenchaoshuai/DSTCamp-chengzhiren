[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dstools"
version = "0.9.9"
description = "DSTCamp - Don't Starve Together local server manager (saves, mods, world & server config)"
requires-python = ">=3.10"
dependencies = [
    "lupa>=2.0",
    "Pillow>=10.0",
    "pystray>=0.19",
    "paramiko>=3.4",
]
license = {text = "MIT"}
readme = "README.md"

[project.scripts]
dst-gui = "dstools.gui.app:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[tool.setuptools.packages.find]
where = ["."]
