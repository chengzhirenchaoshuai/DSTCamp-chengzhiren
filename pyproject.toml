[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dstools"
version = "1.3.5"
description = "DSTCamp - Don't Starve Together server, save, Mod, tunneling and lobby acceleration manager"
requires-python = ">=3.10"
dependencies = [
    "certifi>=2024.0",
    "lupa>=2.0",
    "Pillow>=10.0",
    "pystray>=0.19",
    "paramiko>=3.4",
    "cryptography>=41.0",
]
license = {text = "MIT"}
readme = "README.md"

[project.scripts]
dst-gui = "dstools.gui.app:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[tool.setuptools.packages.find]
where = ["."]
